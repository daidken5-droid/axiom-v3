
name: Build AXIOM OMEGA Android APK

run-name: AXIOM APK · ${{ github.ref_name }} · #${{ github.run_number }}

on:
  workflow_dispatch:

  push:
    paths:
      - "android-app/**"
      - "server/**"
      - ".github/workflows/android-apk.yml"

  pull_request:
    paths:
      - "android-app/**"
      - "server/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: axiom-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
          cache-provider: basic

      - name: Run backend regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r server/requirements-dev.txt
          python -m pytest -q server/tests

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p android-app clean assembleDebug

      - name: Verify APK signature, package ID, and native library
        shell: bash
        run: |
          set -euo pipefail

          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APK_SIGNER="$SDK_ROOT/build-tools/35.0.0/apksigner"

          test -n "$SDK_ROOT" || { echo "Android SDK path was not set"; exit 1; }
          test -s "$APK" || { echo "APK output was not created"; exit 1; }
          test -x "$APK_SIGNER" || { echo "apksigner was not found"; exit 1; }
          command -v apkanalyzer >/dev/null || { echo "apkanalyzer was not found"; exit 1; }

          "$APK_SIGNER" verify --verbose --print-certs "$APK"

          APP_ID="$(apkanalyzer manifest application-id "$APK")"
          echo "Built application ID: $APP_ID"

          test "$APP_ID" = "cz.axiom.app.dev" || {
            echo "Unexpected debug application ID: $APP_ID"
            exit 1
          }

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libaxiom.so' || {
            echo "Expected ARM64 native library libaxiom.so is missing"
            exit 1
          }

          sha256sum "$APK" | tee "${APK}.sha256"
          file "$APK"

          {
            echo "## AXIOM OMEGA debug APK"
            echo "- Application ID: \`$APP_ID\`"
            echo "- APK: \`$APK\`"
            echo "- SHA-256: \`$(cut -d ' ' -f1 "${APK}.sha256")\`"
            echo "- Build variant: debug (test signing)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: AXIOM-OMEGA-5.0-Beta-5-debug-APK-${{ github.run_number }}
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
